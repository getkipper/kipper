server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # script-src 'self' is the key control: an injected inline script won't
    # run, so an XSS can't read the token out of localStorage and post it out.
    # style-src allows inline styles because xterm.js and Vue's dynamic :style
    # bindings inject them. connect-src stays broad (https/wss) because the API
    # and log/terminal sockets live on a sibling subdomain whose name isn't
    # known when this image is built.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
