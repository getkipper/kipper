metadata:
  labels:
    app: shop
    app.kubernetes.io/managed-by: kipper
spec:
  containers:
  - command:
    - sh
    - -c
    - |-
      mkdir -p /www && cat > /www/index.html << 'EOHTML'
      <!DOCTYPE html>
      <html>
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta http-equiv="refresh" content="10">
      <title>Deploying shop</title>
      <style>
      *{margin:0;padding:0;box-sizing:border-box}
      body{font-family:-apple-system,system-ui,sans-serif;background:#0a0a0a;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
      .c{text-align:center;padding:2rem}
      h1{font-size:1.5rem;font-weight:600;margin-bottom:.75rem}
      p{color:#9ca3af;font-size:.9rem;line-height:1.5}
      .s{display:inline-block;width:20px;height:20px;border:2px solid #333;border-top-color:#3b82f6;border-radius:50%;animation:r .8s linear infinite;margin-bottom:1rem}
      @keyframes r{to{transform:rotate(360deg)}}
      </style>
      </head>
      <body>
      <div class="c">
      <div class="s"></div>
      <h1>Building shop</h1>
      <p>Your app is being built and deployed.<br>This page will refresh automatically.</p>
      </div>
      </body>
      </html>
      EOHTML
      httpd -p 8080 -h /www -f
    envFrom:
    - secretRef:
        name: gen-1
        optional: false
    image: busybox:latest
    name: shop
    ports:
    - containerPort: 8080
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  - env:
    - name: LISTEN_PORT
      value: "18080"
    - name: UPSTREAM_PORT
      value: "8080"
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    image: ghcr.io/getkipper/kipper-sidecar:latest
    name: kipper-instance-proxy
    ports:
    - containerPort: 18080
    resources:
      limits:
        cpu: 50m
        memory: 32Mi
      requests:
        cpu: 10m
        memory: 16Mi
