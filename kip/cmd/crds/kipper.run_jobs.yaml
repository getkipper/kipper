---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: jobs.kipper.run
spec:
  group: kipper.run
  names:
    kind: Job
    listKind: JobList
    plural: jobs
    singular: job
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.lastRun
      name: Last Run
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Job is the Schema for the jobs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: JobSpec defines the desired state of a scheduled or one-off
              job.
            properties:
              backoffLimit:
                default: 3
                description: BackoffLimit is the number of retries before marking
                  the job as failed.
                format: int32
                type: integer
              command:
                description: Command overrides the container entrypoint.
                items:
                  type: string
                type: array
              env:
                additionalProperties:
                  type: string
                description: Env holds non-sensitive environment variables.
                type: object
              image:
                description: Image is the container image for the job.
                type: string
              resources:
                description: Resources configures CPU and memory for the job.
                properties:
                  cpuLimit:
                    description: CPULimit is the maximum CPU the container can use
                      (e.g. "100m").
                    type: string
                  cpuRequest:
                    description: CPURequest is the CPU reserved on the node (e.g.
                      "100m").
                    type: string
                  memoryLimit:
                    description: MemoryLimit is the memory cap before the container
                      is OOMKilled (e.g. "128Mi").
                    type: string
                  memoryRequest:
                    description: MemoryRequest is the memory reserved on the node
                      (e.g. "128Mi").
                    type: string
                type: object
              schedule:
                description: Schedule is a cron expression. If empty, the job is one-off.
                type: string
              secretRefs:
                description: SecretRefs lists the names of Secret keys to inject.
                items:
                  type: string
                type: array
            required:
            - image
            type: object
          status:
            description: JobStatus defines the observed state of the job.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastResult:
                description: LastResult is the outcome of the most recent execution.
                enum:
                - Succeeded
                - Failed
                type: string
              lastRun:
                description: LastRun is the timestamp of the most recent execution.
                format: date-time
                type: string
              phase:
                description: Phase represents the current lifecycle phase.
                enum:
                - Scheduled
                - Running
                - Completed
                - Failed
                type: string
              publishedEnv:
                description: |-
                  PublishedEnv is the environment generation the last successful pass
                  published, which is the object a pod started now would read.

                  The console compares it with the generation the pod template names to
                  answer whether a restart would apply anything. Two names settle that; the
                  timestamp comparison it replaced had to reason about when a stamp was
                  written relative to when a kubelet started a container.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
