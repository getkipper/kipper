---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: functions.kipper.run
spec:
  group: kipper.run
  names:
    kind: Function
    listKind: FunctionList
    plural: functions
    singular: function
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.runtime
      name: Runtime
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.replicas
      name: Replicas
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Function is the Schema for the functions API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FunctionSpec defines the desired state of a serverless function.
            properties:
              cspAllowlist:
                description: CSPAllowlist adds external domains to the Content Security
                  Policy.
                items:
                  type: string
                type: array
              env:
                additionalProperties:
                  type: string
                description: Env holds non-sensitive environment variables.
                type: object
              image:
                description: Image is the container image for the function.
                type: string
              noSecurityHeaders:
                description: NoSecurityHeaders disables the default security response
                  headers.
                type: boolean
              port:
                default: 8080
                description: Port is the container port the function listens on.
                format: int32
                type: integer
              resources:
                description: Resources configures CPU and memory for the function.
                properties:
                  cpuLimit:
                    description: CPULimit is the maximum CPU the container can use
                      (e.g. "50m").
                    type: string
                  cpuRequest:
                    description: CPURequest is the CPU reserved on the node (e.g.
                      "50m").
                    type: string
                  memoryLimit:
                    description: MemoryLimit is the memory cap before the container
                      is OOMKilled (e.g. "64Mi").
                    type: string
                  memoryRequest:
                    description: MemoryRequest is the memory reserved on the node
                      (e.g. "64Mi").
                    type: string
                type: object
              runtime:
                default: node
                description: Runtime is the function runtime (node, python, go, custom).
                enum:
                - node
                - python
                - go
                - custom
                type: string
              serviceBindings:
                description: |-
                  ServiceBindings lists Service CRs whose credentials should be
                  injected into the function as prefixed env vars. The keys are
                  service-type-specific (e.g. DB_HOST/DB_PASSWORD for databases,
                  S3_ENDPOINT/S3_ACCESS_KEY/S3_SECRET_KEY for MinIO). Same shape as
                  App.ServiceBindings; both reuse the ServiceBinding type defined in
                  app_types.go.
                items:
                  description: ServiceBinding defines a bound service with an optional
                    env var prefix.
                  properties:
                    database:
                      description: |-
                        Database is the per-app database name created within the service.
                        When set, a per-binding credentials secret is used with this database
                        name instead of the shared service credentials.
                      type: string
                    name:
                      description: Name is the Service CR name.
                      type: string
                    prefix:
                      description: |-
                        Prefix is prepended to credential env var names. The keys are
                        service-type-specific: databases produce <PREFIX>HOST/PORT/USERNAME/
                        PASSWORD, while MinIO (S3) produces <PREFIX>ENDPOINT/ACCESS_KEY/
                        SECRET_KEY. If empty, defaults to a type-based prefix like DB_,
                        REDIS_, S3_, etc.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              source:
                description: Source holds inline function code for the code editor.
                properties:
                  code:
                    description: Code is the function source code.
                    type: string
                  dependencies:
                    additionalProperties:
                      type: string
                    description: |-
                      Dependencies maps third-party package names to version specifiers.
                      For Node functions the controller emits this as a package.json
                      alongside the handler; for Python it becomes a requirements.txt.
                      The runtime image installs them at container startup. Use exact
                      versions to avoid lockfile drift across pod restarts.
                    type: object
                  handler:
                    description: Handler is the entry point file name.
                    type: string
                type: object
              triggers:
                description: Triggers defines what activates the function.
                items:
                  description: FunctionTrigger defines an event source that activates
                    the function.
                  properties:
                    config:
                      additionalProperties:
                        type: string
                      description: Config holds trigger-specific configuration.
                      type: object
                    schedule:
                      description: Schedule is the cron expression for cron triggers.
                      type: string
                    type:
                      description: Type is the trigger type (http, cron, minio, postgres,
                        redis, mysql, rabbitmq).
                      enum:
                      - http
                      - cron
                      - minio
                      - postgres
                      - redis
                      - mysql
                      - rabbitmq
                      type: string
                  required:
                  - type
                  type: object
                type: array
              volumes:
                description: |-
                  Volumes lists shared Volume CRs to mount into the function pod
                  (and into the CronJob pod for cron triggers). Reuses the
                  AppVolumeMount type from app_types.go — each entry names a
                  Volume CR and the container path it should mount at.
                items:
                  description: AppVolumeMount defines a volume mount for the app container.
                  properties:
                    mountPath:
                      description: MountPath is the path inside the container.
                      type: string
                    name:
                      description: Name is the Volume CR name to mount.
                      type: string
                  required:
                  - mountPath
                  - name
                  type: object
                type: array
            type: object
          status:
            description: FunctionStatus defines the observed state of the function.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              endpoint:
                description: Endpoint is the public URL for the function.
                type: string
              phase:
                description: Phase represents the current lifecycle phase.
                enum:
                - Idle
                - Scaling
                - Running
                - Failed
                type: string
              publishedEnv:
                description: |-
                  PublishedEnv is the environment generation the last successful pass
                  published, which is the object a pod started now would read.

                  The console compares it with the generation the pod template names to
                  answer whether a restart would apply anything. Two names settle that; the
                  timestamp comparison it replaced had to reason about when a stamp was
                  written relative to when a kubelet started a container.
                type: string
              replicas:
                description: Replicas is the current number of running replicas (0
                  when idle).
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
