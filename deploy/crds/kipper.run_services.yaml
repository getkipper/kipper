---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: services.kipper.run
spec:
  group: kipper.run
  names:
    kind: Service
    listKind: ServiceList
    plural: services
    singular: service
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.storage
      name: Storage
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Service is the Schema for the services API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ServiceSpec defines the desired state of a stateful service.
            properties:
              bindings:
                description: Bindings lists App CR names that should receive connection
                  credentials.
                items:
                  type: string
                type: array
              consistentBackups:
                type: boolean
              copies:
                description: |-
                  Copies is the requested number of copies of the data volume, each on a different
                  storage node. It applies when the claim is created, and an existing claim
                  keeps its count. Unset means unmanaged: Kipper reports the live copies.
                format: int32
                maximum: 2
                minimum: 1
                type: integer
              resources:
                description: Resources configures CPU and memory for the service.
                properties:
                  cpuLimit:
                    description: CPULimit is the maximum CPU the container can use
                      (e.g. "100m").
                    type: string
                  cpuRequest:
                    description: CPURequest is the CPU reserved on the node (e.g.
                      "100m").
                    type: string
                  memoryLimit:
                    description: MemoryLimit is the memory cap before the container
                      is OOMKilled (e.g. "256Mi").
                    type: string
                  memoryRequest:
                    description: MemoryRequest is the memory reserved on the node
                      (e.g. "256Mi").
                    type: string
                type: object
              storage:
                default: 1Gi
                description: Storage is the persistent volume size (e.g. "5Gi", "10Gi").
                type: string
              tls:
                enum:
                - "off"
                - "on"
                - required
                type: string
              type:
                description: Type is the service engine (postgres, mysql, redis, mongodb,
                  rabbitmq, opensearch, minio, mailhog).
                enum:
                - postgres
                - mysql
                - redis
                - mongodb
                - rabbitmq
                - opensearch
                - minio
                - mailhog
                type: string
              version:
                description: Version is the image tag for the service engine.
                type: string
            required:
            - type
            type: object
          status:
            description: ServiceStatus defines the observed state of the service.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              credentialsSecret:
                description: CredentialsSecret is the name of the Secret containing
                  connection details.
                type: string
              host:
                description: Host is the in-cluster DNS name for the service.
                type: string
              phase:
                description: Phase represents the current lifecycle phase.
                enum:
                - Pending
                - Running
                - Failed
                type: string
              port:
                description: Port is the service port.
                format: int32
                type: integer
              storage:
                description: Storage reports the configured and healthy copies of
                  the data volume.
                properties:
                  class:
                    description: Class is the claim's storage class.
                    type: string
                  copies:
                    description: |-
                      Copies is the replica count configured on the Longhorn volume, or 1 for
                      local storage.
                    format: int32
                    type: integer
                  healthyCopies:
                    description: |-
                      HealthyCopies is the number of Ready, unfenced nodes holding a current
                      copy. Local storage always reports 1.
                    format: int32
                    type: integer
                  nodes:
                    description: Nodes lists those nodes, sorted by name. It is empty
                      for local storage.
                    items:
                      type: string
                    type: array
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
