name: Private data

# Fails a push or pull request that adds private data: a name from the
# PRIVATE_NAME_PATTERN secret, a public server address, a hostname outside
# .private-data-allowlist, or a credential. Every commit in the push is
# scanned. The whole tree is scanned on a weekly schedule and on demand, with
# OCR over images and recordings, so that a change to the pattern or the
# allow-list still finds an old value without turning a push red for content
# the push did not touch. A push carrying an image is reported as unscanned,
# for the pre-push hook and the weekly run to cover; the push job itself needs
# nothing beyond the checkout. Every branch, with no path filter: a value is
# public the moment any branch carries it.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  scan:
    name: no private data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install OCR tools
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          # The runner image carries third-party apt sources whose indexes fail
          # now and then. The packages come from Ubuntu's own repositories, and
          # the install fails on its own if they cannot be found.
          sudo apt-get update -qq || true
          for attempt in 1 2 3; do
            sudo apt-get install -y -qq tesseract-ocr ffmpeg poppler-utils > /dev/null && break
            [ "$attempt" = 3 ] && exit 1
            sleep 20
          done
          tesseract --version | head -1
      - name: Scan the pushed commits, or the whole tree on a schedule
        env:
          PRIVATE_NAME_PATTERN: ${{ secrets.PRIVATE_NAME_PATTERN }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Neither a fork nor Dependabot can read repository secrets, so a
          # pull request from either has no name pattern and runs the address
          # and domain checks alone. A push and a scheduled run always have the
          # secret, and the guard fails when it is missing. Nothing reaches a
          # branch except through a push, so the full check still stands in
          # front of main.
          require=--require-pattern
          if [ -z "$PRIVATE_NAME_PATTERN" ] && [ "$EVENT" = "pull_request" ]; then
            echo "::warning::No name pattern is readable from this pull request, so only the generic checks ran. The push to the base branch scans with the pattern."
            require=""
          fi

          # A pull request is scanned by the scanner from its base branch, so a
          # change to the scanner cannot switch off the check on itself. The
          # allow-list comes from the pull request, where an addition is
          # visible to the reviewer.
          scanner=scripts/private-data-scan.py
          scope=""
          case "$EVENT" in
            pull_request)
              if git show "$PR_BASE:scripts/private-data-scan.py" > "$RUNNER_TEMP/private-data-scan.py" 2>/dev/null; then
                scanner="$RUNNER_TEMP/private-data-scan.py"
              else
                echo "::warning::The base branch has no scanner yet, so this pull request was scanned with its own copy."
              fi
              scope="--range $PR_BASE..$PR_HEAD" ;;
            push)
              # After a force push or on a new branch the old tip is unusable,
              # so scan what this branch has that no other branch on the
              # remote has.
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                scope="--range $BEFORE..$GITHUB_SHA"
              else
                scope="--new $GITHUB_SHA --remote origin"
              fi ;;
          esac

          if [ -n "$scope" ]; then
            echo "=== commits: $scope ==="
            python3 "$scanner" $scope --redact $require
          else
            echo "=== tree at $GITHUB_SHA ==="
            python3 "$scanner" --tree HEAD --redact $require
          fi
      - name: Scanner tests
        run: python3 scripts/private-data-scan_test.py

  gitleaks:
    name: no credentials
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o gitleaks.tar.gz "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" '$2 == f {print $1 "  gitleaks.tar.gz"}' checksums.txt | sha256sum -c --strict -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the whole history
        run: ./gitleaks git --no-banner --redact --config .gitleaks.toml .
