name: Build and publish the docs image

# Builds and publishes kipper-docs when docs change on main or on demand.
# Pull requests targeting main that change docs/** run the same build for
# validation only. The other ten images are built in build-images.yml, which
# ignores docs/** to keep docs-only wording fixes out of the full build matrix.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: build-docs-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: getkipper

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build kipper-docs
        uses: docker/build-push-action@v7
        with:
          context: docs
          file: docs/Dockerfile
          push: false
          cache-from: type=gha,scope=kipper-docs

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile runs the VitePress build, so a page rendering failure
      # stops the job before it can publish a broken site.
      - name: Build and push kipper-docs
        uses: docker/build-push-action@v7
        with:
          context: docs
          file: docs/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/kipper-docs:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/kipper-docs:${{ github.sha }}
          cache-from: type=gha,scope=kipper-docs
          cache-to: type=gha,scope=kipper-docs,mode=max
