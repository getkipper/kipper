name: Build and publish images

# Triggered by the merge to main, plus a manual dispatch to force a rebuild.
#
# This used to wait on the CI workflow succeeding, which is what made a merge
# cost 33 CI jobs before the images were built. CI no longer runs on push: the
# suite runs locally through `act` before the merge instead, so what gates a
# published image is that gate having been run, rather than a workflow_run
# condition here. See the header of ci.yml.
#
# paths-ignore matters more now than it did. It used to be inherited — a docs
# commit did not run CI, so no workflow_run ever fired here. Triggering on push
# directly means this list is the only thing standing between a prose fix and a
# ten-image build matrix.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# One run per ref, for the same reason CI has one: three merges in ten minutes
# should not run three ten-image matrices to completion when only the last
# one's images are ever pulled.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: getkipper

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # console-api builds from the repo root because it imports
          # controller/pkg/labels (a sibling Go module).
          - image: kipper-console-api
            context: .
            dockerfile: console-api/Dockerfile
          # authz builds from the repo root because it imports the CRD
          # types from console-api (a sibling Go module).
          - image: kipper-authz
            context: .
            dockerfile: authz/Dockerfile
          - image: kipper-console
            context: console
            dockerfile: console/Dockerfile
          - image: kipper-gateway
            context: .
            dockerfile: gateway/Dockerfile
          - image: kipper-sidecar
            context: sidecar
            dockerfile: sidecar/Dockerfile
          - image: kipper-poll
            context: kipper-poll
            dockerfile: kipper-poll/Dockerfile
          - image: kipper-datamover
            context: datamover
            dockerfile: datamover/Dockerfile
          - image: kipper-runtime-node
            context: kipper-runtime-node
            dockerfile: kipper-runtime-node/Dockerfile
          - image: kipper-runtime-python
            context: kipper-runtime-python
            dockerfile: kipper-runtime-python/Dockerfile
          - image: kipper-docs
            context: docs
            dockerfile: docs/Dockerfile
    steps:
      # For workflow_run events, github.sha is whatever main points at when
      # this workflow starts — a commit that landed after the CI run would be
      # built and tagged while riding the earlier run's green gate. Pin the
      # checkout and the immutable tag to the commit CI actually tested;
      # manual dispatch has no workflow_run payload and falls back to the
      # dispatched ref's sha.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Stamp console-api with the commit it was built from so /health
          # reports a real version for the CLI's version handshake. Other
          # images do not declare a VERSION arg, so they are left unset.
          build-args: ${{ matrix.image == 'kipper-console-api' && format('VERSION={0}', github.event.workflow_run.head_sha || github.sha) || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
