server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 301 /en/;
    }

    location / {
        try_files $uri $uri/ $uri.html /en/index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
