server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS, so nginx sees plain HTTP and would build an
    # http:// Location. A relative one keeps the browser on HTTPS.
    absolute_redirect off;

    location = / {
        return 301 /en/;
    }

    # VitePress writes a real .html file per page, so a request that matches
    # nothing is a genuine 404 rather than a route the client will resolve.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
